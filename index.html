<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FocusFlow — A premium, distraction-free Pomodoro productivity timer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>FocusFlow — Productivity Timer</title>
  </head>
  <body>
    <!-- App Container -->
    <div id="app" class="app-container">

      <!-- Header: Logo, Brand & Actions -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </div>
          <span class="brand-name">FocusFlow</span>
        </div>

        <div class="header-actions">
          <div class="target-badge" title="Completed focus sessions toward daily goal">
            <span class="target-pulse"></span>
            <span class="target-text">Target: <strong id="stat-target">0/8</strong></span>
          </div>

          <!-- Dark/Light Theme Toggle -->
          <button
            type="button"
            id="theme-toggle-btn"
            class="icon-btn"
            aria-label="Switch between dark and light theme"
            title="Toggle Theme"
          >
            <!-- Sun Icon (shown in dark mode) -->
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <!-- Moon Icon (shown in light mode) -->
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>

          <!-- Settings Button -->
          <button
            type="button"
            id="open-settings-btn"
            class="icon-btn"
            aria-label="Open timer settings"
            title="Settings"
          >
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content">
        
        <!-- Primary Timer Card -->
        <section class="timer-card" aria-label="Pomodoro Timer">

          <!-- Mode Tabs: Focus, Short Break, Long Break -->
          <nav class="mode-tabs" role="tablist" aria-label="Timer Modes">
            <button
              type="button"
              class="tab-btn active"
              role="tab"
              aria-selected="true"
              data-mode="focus"
            >
              Focus
            </button>
            <button
              type="button"
              class="tab-btn"
              role="tab"
              aria-selected="false"
              data-mode="short-break"
            >
              Short Break
            </button>
            <button
              type="button"
              class="tab-btn"
              role="tab"
              aria-selected="false"
              data-mode="long-break"
            >
              Long Break
            </button>
          </nav>

          <!-- Circular Countdown Display -->
          <div class="circle-timer-wrap">
            <svg class="progress-ring" viewBox="0 0 300 300" aria-hidden="true">
              <defs>
                <!-- Violet Gradient Accent -->
                <linearGradient id="violetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a78bfa" />
                  <stop offset="50%" stop-color="#8b5cf6" />
                  <stop offset="100%" stop-color="#6d28d9" />
                </linearGradient>
                <!-- Subtle glow filter -->
                <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.35" />
                </filter>
              </defs>

              <!-- Track background circle (radius = 130, circumference ≈ 816.8) -->
              <circle
                class="progress-ring__track"
                cx="150"
                cy="150"
                r="130"
              />

              <!-- Active violet progress circle -->
              <circle
                class="progress-ring__circle"
                cx="150"
                cy="150"
                r="130"
                filter="url(#violetGlow)"
              />
            </svg>

            <!-- Center Content inside Circular Ring -->
            <div class="circle-center-content">
              <span class="timer-mode-pill" id="timer-mode-label">Focus</span>
              <div class="timer-digits" id="timer-display" aria-live="polite">25:00</div>
              <span class="timer-status-hint" id="timer-status">Ready to begin</span>
            </div>
          </div>

          <!-- Controls: Start, Pause & Reset -->
          <div class="timer-controls">
            <button
              type="button"
              id="reset-btn"
              class="btn-control btn-secondary"
              aria-label="Reset timer (Shortcut: R)"
              title="Reset (R)"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              <span>Reset</span>
            </button>

            <button
              type="button"
              id="start-btn"
              class="btn-control btn-primary"
              aria-label="Start timer (Shortcut: Space)"
              title="Start (Space)"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                <polygon points="6 4 20 12 6 20 6 4" />
              </svg>
              <span>Start</span>
            </button>

            <button
              type="button"
              id="pause-btn"
              class="btn-control btn-secondary"
              aria-label="Pause timer (Shortcut: Space)"
              title="Pause (Space)"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
              <span>Pause</span>
            </button>
          </div>

          <!-- Session Indicator Tracker -->
          <div class="session-tracker">
            <span class="session-info">Cycle Session <strong id="session-count">1</strong> of 4</span>
            <div class="session-dots" id="session-dots" aria-hidden="true">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>

        </section>

        <!-- Productivity Statistics Section -->
        <section class="stats-grid" aria-label="Session Statistics">
          <div class="stat-card">
            <span class="stat-label">Focus Time</span>
            <div class="stat-value"><span id="stat-focus-time">0</span><span class="stat-unit">m</span></div>
            <span class="stat-sub">Total today</span>
          </div>

          <div class="stat-card">
            <span class="stat-label">Completed</span>
            <div class="stat-value"><span id="stat-completed-count">0</span><span class="stat-unit">/8</span></div>
            <span class="stat-sub">Intervals done</span>
          </div>

          <div class="stat-card">
            <span class="stat-label">Day Streak</span>
            <div class="stat-value"><span id="stat-streak">0</span><span class="stat-unit">🔥</span></div>
            <span class="stat-sub">Consistency</span>
          </div>
        </section>

      </main>

      <!-- Minimal Footer with Keyboard Shortcuts -->
      <footer class="app-footer">
        <p class="footer-shortcuts">
          <kbd class="kbd-key">Space</kbd> Start / Pause &bull; <kbd class="kbd-key">R</kbd> Reset
        </p>
        <p class="footer-tagline">FocusFlow &bull; Stay centered in your work</p>
      </footer>

    </div>

    <!-- Settings Modal -->
    <div id="settings-backdrop" class="modal-backdrop" hidden>
      <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-header">
          <h2 id="settings-title" class="modal-title">Timer Settings</h2>
          <button
            type="button"
            id="close-settings-btn"
            class="icon-btn close-btn"
            aria-label="Close settings"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <form id="settings-form" class="settings-form" novalidate>
          <div class="form-group">
            <label for="setting-focus" class="form-label">
              <span>Focus Duration</span>
              <span class="form-unit">(1 - 90 min)</span>
            </label>
            <input
              type="number"
              id="setting-focus"
              class="form-input"
              min="1"
              max="90"
              step="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="setting-short-break" class="form-label">
              <span>Short Break</span>
              <span class="form-unit">(1 - 60 min)</span>
            </label>
            <input
              type="number"
              id="setting-short-break"
              class="form-input"
              min="1"
              max="60"
              step="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="setting-long-break" class="form-label">
              <span>Long Break</span>
              <span class="form-unit">(1 - 60 min)</span>
            </label>
            <input
              type="number"
              id="setting-long-break"
              class="form-input"
              min="1"
              max="60"
              step="1"
              required
            />
          </div>

          <!-- Preferences: Sound & Notifications -->
          <div class="form-toggles">
            <label class="toggle-row" for="setting-sound">
              <span class="toggle-info">
                <span class="toggle-title">Gentle Chime</span>
                <span class="toggle-desc">Play relaxing sound on interval completion</span>
              </span>
              <input type="checkbox" id="setting-sound" class="toggle-checkbox" checked />
            </label>

            <label class="toggle-row" for="setting-notification">
              <span class="toggle-info">
                <span class="toggle-title">Desktop Notifications</span>
                <span class="toggle-desc" id="notification-status-desc">Alert when a session or break ends</span>
              </span>
              <input type="checkbox" id="setting-notification" class="toggle-checkbox" />
            </label>
          </div>

          <!-- Inline validation error message -->
          <div id="settings-error" class="settings-error" hidden role="alert"></div>

          <!-- Form Action Buttons -->
          <div class="modal-actions">
            <button type="button" id="reset-defaults-btn" class="btn-text">
              Reset to Defaults
            </button>
            <button type="submit" class="btn-control btn-primary modal-save-btn">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Main JavaScript Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
